# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "Király–Tanigawa three-dimensional body–pin rigidity"
  description: >-
    An end-to-end Lean 4 proof of the maximum-rank, Euclidean local-rigidity,
    and continuous-rigidity forms of the
    Király–Tanigawa partition criterion for real three-dimensional body–pin
    rigidity. For every finite loopless occurrence-indexed body–pin
    multigraph and every permitted number of private body vertices, the
    formalization proves that the partition inequalities are equivalent to
    maximum attainable rigidity-matrix rank for the expanded bar–joint graph.
    The proof includes the sparse-support construction, collinearity-flag
    semismallness, and the ideal-height estimates used in the sufficiency
    direction. A proved Asimow–Roth bridge identifies maximum rank with
    ordinary local and continuous rigidity on open dense sets of Euclidean placements.
  authors:
    - "Dongzhe (Denzel) Zheng"
  responsible_maintainers:
    - "Dongzhe (Denzel) Zheng"
  license: "Apache-2.0"

sources:
  - title: "Stress Degeneracy of Direction Complexes of (2,2)-Sparse Graphs and Three-Dimensional Body-Pin Rigidity"
    authors:
      - "Dongzhe (Denzel) Zheng"
    id: "https://doi.org/10.13140/RG.2.2.17830.28485"
    type: "paper"
    location: "Theorems A.1 and 1.1, in maximum-rank and generic Euclidean rigidity form"
    relationship: "formalizes"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/bryangingechen/CombinatorialRigidity"
    relationship: "other"
    note: >-
      A related Lean development of combinatorial rigidity, including
      body–bar rigidity. The interoperability target in this repository
      exports the occurrence-indexed body multigraph through mathlib's Graph
      interface; the expanded bar–joint graph remains a SimpleGraph.
      The separate interop/combinatorial-rigidity package proves equality of
      the two projects' realized and generic rigidity ranks using the same
      BarJoint source file under the related project's pinned toolchain.

classification:
  arxiv:
    - "math.CO"
  msc2020:
    - "52C25"
    - "05C50"

status:
  scope: >-
    The compared root theorem is manuscript Theorem A.1 in maximum-rank form.
    Both implications are proved uniformly for every finite loopless
    body–pin incidence structure and every additional-private-vertex
    function; parallel pins and the empty and one-body cases are included.
    No theorem used in the proof is introduced as a project-specific axiom or
    as a literature hypothesis. A second closed root proves the partition
    criterion equivalent to local rigidity on an open dense set of native
    Euclidean placements. The Asimow–Roth bridge, including the analytic
    regular-fibre argument and open dense regular locus, is proved in the
    development. A third closed root states the equivalent generic continuous-
    rigidity property, quantifying over every continuous motion and every time.
    The geometric roots have no independent Comparator challenges.
    Challenge.lean contains one deliberate Comparator placeholder, which is
    excluded from the proof-development sorry counts below.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "RB31E2E.endToEndBodyPinStatement"
      file: "RB31EndToEnd.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "RB31E2E.endToEndGeometricBodyPinStatement"
      file: "RB31Geometric.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
    - declaration: "RB31E2E.endToEndContinuousBodyPinStatement"
      file: "RB31Geometric.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []

automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Mathematical design, source selection, theorem statement, proof
        decisions, and final review by the author.
    - method: "agent"
      models:
        - "GPT-5.6 Sol"
      framework: "OpenAI Codex"
      tool_setup: >-
        Author-directed assistance with proof organization and detailed
        checking, Lean formalization and verification, and proofreading.
  notes: >-
    The reported builds and axiom audits use the repository's pinned Lean and
    Mathlib environment and reproducibility scripts.

fidelity:
  divergences: >-
    The original formal root is the maximum-rank statement of manuscript
    Theorem A.1. The new geometric roots state the equivalent open-dense local
    and continuous Euclidean rigidity properties of the actual expanded graph,
    using edge distances, neighbourhoods, continuous motions, and pairwise congruence. Simultaneously
    rank-regular placements form a proved open dense nonempty set; no
    identification with coordinate algebraic independence is claimed.
    The occurrence-indexed body graph is a finite loopless multigraph, while its
    expanded bar–joint graph and the sparse support are simple graphs, matching
    their respective mathematical roles.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex (GPT-5.6 Sol)"
  notes: >-
    Author-directed review covered the statement surface, source dependency
    closure, forbidden placeholders, and the root theorem's axiom closure.
    The proof and audit scripts were run in the pinned environment on a remote
    server. No independent human peer review or Palomar review is claimed.

alignment:
  namespace: "RB31E2E"
  statements:
    - source: "Theorem A.1 (maximum-rank body–pin partition theorem)"
      lean: "RB31E2E.endToEndBodyPinStatement"
      module: "RB31EndToEnd"
      status: "proved"
      note: >-
        This is the closed, zero-parameter root theorem compared by
        comparator.json. It proves both implications for every input covered
        by the source statement.
    - source: "Theorem 1.1 (generic rigidity in the usual geometric sense)"
      lean: "RB31E2E.endToEndContinuousBodyPinStatement"
      module: "RB31Geometric"
      status: "proved"
      note: >-
        The formal statement uses continuous rigidity on an open dense set of
        native Euclidean placements; a second root gives the equivalent local
        formulation. The proof derives the Asimow–Roth bridge
        from the implicit function theorem and the squared-length map,
        without an external Asimow–Roth hypothesis. Tests/GeometricSemantics.lean
        checks both expanded Euclidean statements, including the
        continuous-motion quantifiers.

acknowledgements: >-
  Built with Lean 4 and Mathlib. OpenAI Codex (GPT-5.6 Sol) assisted with
  document organization and typesetting, refinement of proof details, the
  Lean formalization and its verification, and proofreading.
